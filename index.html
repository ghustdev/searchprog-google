<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Base de Conhecimento</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style/style.css">
</head>

<body>
  <canvas id="canvas3d"></canvas>

  <main>
    <div class="content-wrapper">
      <header>
        <h1 class="title">Base de Conhecimento</h1>
      </header>

      <div class="container-input">
        <input type="text" id="input" placeholder="Digite uma linguagem de programação...">
        <button id="button">Buscar</button>
      </div>
    </div>
    <div class="chat-container">
      <div class="chat-header">
        <h2>Assistente Virtual</h2>
      </div>
      <div class="chat-messages" id="chat-messages">
        <!-- Mensagens do chat aparecerão aqui -->
        <div class="message assistant">Olá! Como posso ajudar você hoje?</div>
      </div>
      <div class="chat-input-area">
        <input type="text" id="chat-input" placeholder="Pergunte algo...">
        <button id="send-button" aria-label="Enviar mensagem">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" />
          </svg>
        </button>
      </div>
    </div>
  </main>

  <footer>
    <ul>
      <li><a href="https://www.linkedin.com/in/gustavo-cardosoc-costa/" target="_blank"
          rel="noopener noreferrer">LinkedIn</a></li>
      <li><a href="https://github.com/gustavocardoso" target="_blank" rel="noopener noreferrer">GitHub</a></li>
    </ul>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script type="module" src="https://unpkg.com/@splinetool/viewer@1.0.94/build/spline-viewer.js"></script>
  <script type="module" src="script/main.js"></script>
</body>

</html>
