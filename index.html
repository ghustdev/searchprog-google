<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dev Google Alura - Base de Conhecimento</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <canvas id="canvas3d"></canvas>

  <main>
    <div class="content-wrapper">
      <header>
        <h1 class="title">Explore o Universo da Tecnologia</h1>
      </header>

      <div class="container-input">
        <input type="text" id="input" placeholder="Busque por tecnologias, frameworks, linguagens..." />
        <button id="button">Buscar</button>
      </div>

      <!-- Container para as tags de tópicos -->
      <div id="topic-tags-container">
        <button class="topic-tag active">Todos</button>
        <button class="topic-tag">Frontend</button>
        <button class="topic-tag">Backend</button>
        <button class="topic-tag">Ferramentas</button>
        <button class="topic-tag">Carreira</button>
      </div>

      <!-- Container para os resultados da busca -->
      <div id="results-container">
        <!-- Os cards de conhecimento serão inseridos aqui pelo JavaScript -->
      </div>
    </div>
  </main>

  <footer>
    <ul>
      <li><a href="#">Sobre</a></li>
      <li><a href="#">Projetos</a></li>
      <li><a href="#">Contato</a></li>
    </ul>
  </footer>

  <script type="module" src="https://unpkg.com/@splinetool/runtime@1.9.0/build/runtime.js"></script>
  <script type="module" src="main.js"></script>
</body>

</html>
